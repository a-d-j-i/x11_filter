# Tag a release, get a release.
#
#     git tag -a v0.9 -m 'xfilter 0.9' && git push origin v0.9
#
# The tag is the trigger and the checkout is the tag, so package.sh builds the
# tagged tree and nothing else.  What comes out is attached to the release:
#
#   xfilter_VERSION_all.deb          what people install
#   xfilter_UPSTREAM.orig.tar.gz     the upstream tarball, byte-reproducible
#   xfilter_VERSION.dsc              the Debian source package: what a
#   xfilter_VERSION.debian.tar.xz    sponsor would upload, and what
#                                    debian/watch and uscan look for
#   SHA256SUMS
#
# The orig tarball is uploaded rather than left to GitHub's generated "Source
# code (tar.gz)": that one is regenerated on demand and its checksum has
# changed before now, and a Debian .dsc pins the checksum for ever.
#
# Two jobs, because they need different machines.  The package is built and
# checked in a Debian container -- Ubuntu's lintian rejects "unstable" as a
# distribution and knows an older Policy -- and published from the runner,
# which is where the gh command lives.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v5
      # The workspace is owned by the runner user and the container runs as
      # root, which git calls dubious ownership and refuses to read.  Without
      # this, package.sh cannot ask for the commit date and quietly stamps the
      # tarball with the epoch instead.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build dependencies
        run: |
          apt-get install -y -qq --no-install-recommends \
              build-essential debhelper dpkg-dev fakeroot lintian python3

      # A tag that disagrees with debian/changelog would ship a package whose
      # version is not the version people think they downloaded.  Stop here
      # instead: the fix is a changelog entry, and it belongs in the tag.
      - name: Tag must match debian/changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          changelog="$(dpkg-parsechangelog -S Version)"
          upstream="${changelog%-*}"
          if [ "$tag" != "$upstream" ]; then
              echo "tag $GITHUB_REF_NAME is upstream version '$tag'," \
                   "but debian/changelog says '$upstream' (from $changelog)" >&2
              exit 1
          fi

      - name: Build the package
        run: ./package.sh

      - name: Lintian
        run: |
          lintian --fail-on error,warning \
              --suppress-tags initial-upload-closes-no-bugs \
              build/xfilter_*.changes

      - name: Checksums
        run: cd build && sha256sum xfilter_* > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: |
            build/xfilter_*
            build/SHA256SUMS

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to create the release
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-files
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "xfilter ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              release/*
